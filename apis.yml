name: legal.ge Public APIs
description: >-
  Georgia's (the country's) legal marketplace, exposing a public, keyless, read-only REST API that turns a
  natural-language description of a legal problem into matched practice areas and a ranked list of verified
  specialists — lawyers, law firms, accountants, tax consultants, mediators and enforcement agents — each with a
  canonical, locale-prefixed profile URL. The surface is deliberately agent-first: an OpenAPI 3.1 contract at
  /api/openapi.json, an APIs.json 0.19 index at /apis.json, an llms.txt trust contract at /llms.txt, a robots.txt
  that names and allows eleven AI crawlers on the public API paths, and an installable MCP server (@legalge/mcp,
  MIT) exposing find_legal_specialists and classify_legal_intent to Claude Desktop, Cursor and any MCP-aware
  client. Trilingual across Georgian, English and Russian; every specialist returned is verification-checked, and
  contact details are opt-in only.
