  - name: legal.ge MCP Server
    description: >-
      First-party Model Context Protocol server wrapping the Ask API as two callable tools —
      find_legal_specialists (POST /api/ask) and classify_legal_intent (GET /api/ask/classify). Distributed as the
      MIT-licensed npm package @legalge/mcp and run locally over stdio (npx -y @legalge/mcp); there is no hosted
      HTTP MCP endpoint. Read-only by construction: it cannot create inquiries or bookings. Trilingual (ka/en/ru),
      no API key required, optional LEGALGE_BASE_URL override.
    humanURL: https://github.com/infolegalge/legal.ge-mcp
