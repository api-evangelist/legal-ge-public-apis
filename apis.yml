apis:
  - name: legal.ge Ask API
    description: >-
      Public, keyless, read-only REST API matching natural-language legal queries to practice areas, services, and a
      ranked list of verified specialists. Six operations across five paths: POST/GET /api/ask, GET
      /api/ask/classify, GET /api/service-search, GET /api/specialists/search, and GET
      /api/specialists/{id}/contact. No authentication; gated by per-IP rate limits (60/min ask, 120/min classify,
      30/min name search, 10/min contact reveal). Errors use a stable custom envelope with a machine-readable code.
    humanURL: https://legal.ge
    baseURL: https://legal.ge
