  cursor: same shape in ~/.cursor/mcp.json or .cursor/mcp.json
tools:
- name: find_legal_specialists
  description: Find verified legal specialists in Georgia (the country, not the US state) from a natural-language
    description of a legal situation or need. Returns matched practice areas (and specific services where
    applicable) plus a ranked list of verified specialists, each with a canonical profile URL on legal.ge.
    Supports Georgian (ka), English (en) and Russian (ru).
  source_operation: openapi/legal-ge-public-apis-openapi.yml#askMatchSpecialists
  backing_call: POST https://legal.ge/api/ask
  inputs:
  - query
  - locale
  - limit
  required:
  - query
- name: classify_legal_intent
  description: Classify a free-text legal question into matched practice areas (categories and specific
    services) without returning specialists. Lighter weight than find_legal_specialists; returns matched
    categories with parent chains.
  source_operation: openapi/legal-ge-public-apis-openapi.yml#classifyLegalIntent
  backing_call: GET https://legal.ge/api/ask/classify
  inputs:
  - query
  - locale
  required:
  - query
side_effects:
  read_only: true
  note: The server cannot create inquiries, bookings, or any other side effect — it only queries. Sending
    an inquiry to a specialist requires the user to sign in on legal.ge, which is deliberately not exposed
    to agents.
